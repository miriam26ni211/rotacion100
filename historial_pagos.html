<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historial de Pagos - Rotacion100</title>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const SUPABASE_URL = 'TU_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.addEventListener('DOMContentLoaded', async () => {
    const pagosContainer = document.getElementById('pagos');
    const session = supabase.auth.session();
    if (!session) return window.location.href='/index.html';
    const userId = session.user.id;
    const { data: pagos } = await supabase.from('pagos').select('*').eq('usuario_id', userId).order('created_at', { ascending: false });
    pagosContainer.innerHTML = pagos.map(p => `<li>$${p.monto} - ${p.metodo_pago} - ${new Date(p.created_at).toLocaleString()}</li>`).join('');
});
</script>
<style>
body{font-family:Inter,sans-serif;background:#071b2a;color:#e6eef8;padding:20px;}
ul{list-style:none;padding:0;}
li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.1);}
</style>
</head>
<body>
<h1>Historial de pagos</h1>
<ul id="pagos"></ul>
</body>
</html>
